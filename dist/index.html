<h3 data-pl="Jak wygląda albumina?" data-en="What does albumin look like?"></h3>
<figure class="structure"><img loading="lazy" src="https://cdn.rcsb.org/images/structures/pdb/1bj5_assembly-1.jpeg" alt="1BJ5"><figcaption data-pl="Model z pomiarów rentgenowskich. Wstęga pokazuje przebieg zwiniętego łańcucha białka. W tej strukturze badacze znaleźli pięć cząsteczek mirystynianu, długołańcuchowego kwasu tłuszczowego w postaci jonowej." data-en="A model derived from X-ray measurements. The ribbon traces the folded protein chain. In this structure researchers found five molecules of myristate, the ionic form of a long-chain fatty acid."></figcaption></figure>
<p><a href="https://www.rcsb.org/3d-view/1BJ5" data-pl="Obróć model 3D w RCSB PDB" data-en="Rotate the 3D model in RCSB PDB"></a> · <a href="https://doi.org/10.1038/1869">Curry et al., 1998</a></p>
<h3 data-pl="Poza maturą · październik 2026" data-en="Beyond the exam · October 2026"></h3>
<p data-pl="Co dzieje się z białkiem po przyłączeniu kwasu tłuszczowego? W symulacjach zespołu Batalovej zmienił się ruch fragmentów albuminy, m.in. w otoczeniu Cys34. To cysteina na pozycji 34 — ta, która w typowej strukturze albuminy pozostaje poza 17 mostkami disiarczkowymi." data-en="What happens to the protein when a fatty acid binds? In simulations by Batalova and colleagues, regions of albumin moved differently, including the region around Cys34. This is cysteine at position 34, the residue outside the 17 disulfide bridges in the usual albumin structure."></p>
<p data-pl="Autorzy wykonali też inny pomiar: za pomocą magnetycznego rezonansu jądrowego (NMR) porównali białko przed kontaktem z czynnikiem modyfikującym cysteinę i po nim. Widma były podobne. Ten pomiar dotyczył ogólnej struktury białka; szczegóły ruchu przy Cys34 pochodzą z symulacji." data-en="The authors also made a different measurement. Using nuclear magnetic resonance (NMR), they compared the protein before and after exposure to a cysteine-modifying agent. The spectra were similar. This measurement concerned the overall protein structure; the detailed motion around Cys34 came from simulations."></p>
<a href="https://doi.org/10.3390/ijms27219687" data-pl="Przeczytaj badanie: Batalova i wsp. (2026)" data-en="Read the study: Batalova et al. (2026)"></a></section><footer class="paperline"><a id="questionLink" target="_blank" rel="noopener"></a><a id="keyLink" target="_blank" rel="noopener"></a></footer></article></section>
