<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Atlas Matura</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand"><b>✳</b> Atlas Matura</div><nav><a href="https://mervive.com/learn/" id="learnHome">Nauka</a><button id="study"></button><button id="library"></button><select id="language" aria-label="Język / Language"><option value="pl" lang="pl">Polski</option><option value="en" lang="en">English</option></select><button id="theme"></button></nav></header>
<main><section id="studio"><h1 id="heading"></h1><div class="toolbar"><select id="subject"></select><select id="pick"></select></div><div class="toolbar"><button id="prev"></button><button id="next"></button><span id="progress"></span></div><p class="kicker" id="badge"></p><h2 id="tasktitle"></h2>
<div class="layout"><div><section class="model" id="model"><h2 id="modelTitle"></h2><canvas width="980" height="420" id="canvas" class="visual" aria-hidden="true"></canvas><p class="legend" id="legend"></p><div class="counter"><label for="count" id="countLabel"></label><output id="amount" for="count"></output></div><input type="range" class="range" id="count" min="1"><p id="result" aria-live="polite"></p></section>
<article id="practice" class="panel practice"><h2 id="practiceHeading"></h2><label for="answer" id="prompt"></label><form class="actions" id="quiz"><input required type="number" min="0" step="1" id="answer"><button id="check"></button></form><p class="feedback" role="status" id="feedback"></p></article>
<article id="stage" class="panel"><label for="response"><strong id="draftTitle"></strong></label><p id="draftHint"></p><textarea id="response"></textarea><div class="toolbar"><a id="questionLink" target="_blank" rel="noopener"></a><a id="keyLink" target="_blank" rel="noopener"></a></div><details id="solution"><summary id="solutionTitle"></summary><p id="modelAnswer"></p><pre id="solutionDiagram" hidden></pre><p id="criterion" class="fine"></p></details><button id="done"></button></article></div>
<aside><article class="panel" id="explanation"><h2 id="topic"></h2><p id="lesson"></p><h3 id="goalHeading"></h3><p id="goal"></p></article><article class="panel"><label for="notes"><strong id="notesTitle"></strong></label><p class="fine" id="local"></p><textarea id="notes"></textarea><small role="status" id="saved"></small></article></aside></div></section>
<section id="shelf" hidden><h1 id="shelfTitle"></h1><h2 style="margin-top:24px" id="papersTitle"></h2><div id="papers"></div><h2 id="resources"></h2><p><a id="zpe" href="https://zpe.gov.pl/a/od-atomu-do-organizmu/DD1gSe00C"></a></p><p><a id="cke" href="https://bip.cke.gov.pl/artykul/211/1659/egzamin-maturalny-w-formule-2023"></a></p></section></main><script src="questions.js"></script><script src="app.js"></script></body></html>
